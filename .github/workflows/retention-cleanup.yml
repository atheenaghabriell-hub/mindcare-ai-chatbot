name: MindCare retention cleanup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-expired-review-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_CONNECTION: pgsql
      DB_URL: ${{ secrets.NEON_DATABASE_URL }}
      DB_SSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql
          coverage: none
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress
      - name: Purge expired opt-in safety metadata
        run: php artisan mindcare:purge-expired-crisis-reviews
